[package]
name = "skytween"
version = "0.1.0"
description = "OpenTween-style Bluesky desktop client"
authors = ["SkyTween Contributors"]
edition = "2021"

[lib]
name = "skytween_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-winrt-notification = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
